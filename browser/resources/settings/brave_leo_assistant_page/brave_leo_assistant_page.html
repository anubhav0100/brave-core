<link rel="stylesheet" href="chrome://resources/brave/css/nala.css">
<style include="settings-shared md-select">
  .reset-leo {
      cursor: pointer;
      color: red;
  }

  .header {
    padding: var(--leo-spacing-2xl);
  }

  .main-header {
    font: var(--leo-font-heading-h4);
  }
</style>

<settings-section
  id="leoAssistant"
  page-title="$i18n{leoAssistant}">
  <div class="settings-box header">
    <div class="flex">
      <div class="main-header">$i18n{braveLeoAssistantAboutLeoLabel}</div>
      <div class="label secondary">
        <p>$i18n{braveLeoAssistantAboutLeoDesc1}</p>
        <p>$i18nRaw{braveLeoAssistantAboutLeoDesc2}</p>
      </div>
    </div>
  </div>

  <settings-toggle-button class="cr-row hr"
    pref="[[itemPref_(leoAssistantShowOnToolbarPref_)]]"
    label="$i18n{braveLeoAssistantShowIconOnToolbarLabel}"
    on-settings-boolean-control-change="onLeoAssistantShowOnToolbarChange_">
  </settings-toggle-button>
  <settings-toggle-button class="cr-row hr"
    pref="{{prefs.brave.ai_chat.context_menu_enabled}}"
    label="$i18n{braveLeoAssistantShowInContextMenuLabel}"
    sub-label="$i18n{braveLeoAssistantShowInContextMenuDesc}">
  </settings-toggle-button>
  <template is="dom-if"
    if="[[isTabOrganizationFeatureEnabled_]]">
    <settings-toggle-button class="cr-row hr"
      pref="{{prefs.brave.ai_chat.tab_organization_enabled}}"
      label="$i18n{braveLeoAssistantTabOrganizationLabel}"
      sub-label-with-link="$i18n{braveLeoAssistantTabOrganizationDesc}"
      on-sub-label-link-clicked="openTabOrganizationLearnMore_">
    </settings-toggle-button>
  </template>
  <settings-toggle-button class="cr-row hr"
    id="contentIndexingToggle"
    pref="{{prefs.brave.ai_chat.content_indexing_enabled}}"
    label="$i18n{braveLeoAssistantContentIndexingLabel}"
    sub-label="$i18n{braveLeoAssistantContentIndexingDesc}"
    on-settings-boolean-control-change="onContentIndexingToggleChange_">
  </settings-toggle-button>
  <template is="dom-if" if="[[prefs.brave.ai_chat.content_indexing_enabled.value]]" restamp>
    <div class="cr-row continuation" style="justify-content: space-between; align-items: center;">
      <div class="cr-secondary-text">
        [[contentIndexStatusText_(contentIndexEntryCount_, contentIndexAvailable_)]]
      </div>
      <cr-button on-click="onClearContentIndex_"
        disabled="[[!hasContentIndexEntries_(contentIndexEntryCount_)]]">
        $i18n{braveLeoAssistantContentIndexingClearButtonLabel}
      </cr-button>
    </div>
  </template>
  <settings-toggle-button class="cr-row hr"
    id="rollingSummarizationToggle"
    pref="{{prefs.brave.ai_chat.rolling_summarization_enabled}}"
    label="$i18n{braveLeoAssistantRollingSummarizationLabel}"
    sub-label="$i18n{braveLeoAssistantRollingSummarizationDesc}">
  </settings-toggle-button>
  <settings-toggle-button class="cr-row hr"
    id="modelFallbackToggle"
    pref="{{prefs.brave.ai_chat.model_fallback_enabled}}"
    label="$i18n{braveLeoAssistantModelFallbackLabel}"
    sub-label="$i18n{braveLeoAssistantModelFallbackDesc}">
  </settings-toggle-button>
  <template is="dom-if" if="[[prefs.brave.ai_chat.model_fallback_enabled.value]]" restamp>
    <div class="settings-box">
      <div class="flex cr-padded-text">
        <div>$i18n{braveLeoAssistantModelFallbackModelLabel}</div>
      </div>
      <leo-model-selector
        class="cr-padded-text"
        selected-key="[[prefs.brave.ai_chat.model_fallback_model_key.value]]"
        models="[[modelFallbackModels_]]"
        is-premium-user="[[isPremiumUser_]]"
        on-model-changed="onModelFallbackModelChange_">
      </leo-model-selector>
    </div>
  </template>
  <cr-link-row class="hr"
    label="$i18n{braveLeoAssistantAutocompleteLink}"
    on-click="openAutocompleteSetting_">
  </cr-link-row>
  <template is="dom-if" if="[[isPremiumUser_]]">
    <cr-link-row on-click="openManageAccountPage_" external="true" class="hr" label="$i18n{braveLeoAssistantManageUrlLabel}"></cr-link-row>
  </template>
  <template is="dom-if" if="[[isHistoryFeatureEnabled_]]">
    <div class="settings-box " on-click="onResetAssistantData_">
      <div class="flex cr-padded-text reset-leo">
        <div>$i18n{braveLeoAssistantResetAndClearDataLabel}</div>
      </div>
    </div>
  </template>
</settings-section>
