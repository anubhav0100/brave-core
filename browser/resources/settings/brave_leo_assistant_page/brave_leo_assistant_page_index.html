<style include="settings-shared">
  cr-view-manager [hidden-by-search],
  cr-view-manager[show-all] [slot=view][data-parent-view-id] {
    display: none;
  }
  cr-view-manager [slot=view]:not(.closing) {
    position: initial;
  }
</style>

<cr-view-manager id="viewManager" class="cr-centered-card-container"
  show-all$="[[shouldShowAll]]">
  <settings-brave-leo-assistant-page slot="view" id="assistant" prefs="{{prefs}}">
  </settings-brave-leo-assistant-page>

  <brave-leo-personalization
    id="personalization"
    slot="view"
    prefs="{{prefs}}"
    in-search-mode="[[inSearchMode_]]">
  </brave-leo-personalization>

  <model-list-section
    id="model-list"
    slot="view"
    prefs="{{prefs}}"
    in-search-mode="[[inSearchMode_]]">
  </model-list-section>

  <page-capture-section
    id="page-capture"
    slot="view">
  </page-capture-section>

  <webhook-tools-section
    id="webhook-tools"
    slot="view">
  </webhook-tools-section>

  <ai-chat-history-section
    id="ai-chat-history"
    slot="view">
  </ai-chat-history-section>

  <workflows-section
    id="workflows"
    slot="view">
  </workflows-section>

  <n8n-terminal-section
    id="n8n-terminal"
    slot="view">
  </n8n-terminal-section>

  <delegation-terminal-section
    id="delegation-terminal"
    slot="view">
  </delegation-terminal-section>

  <leo-customization-subpage slot="view" id="customization"
    data-parent-view-id="personalization" prefs="{{prefs}}">
  </leo-customization-subpage>

  <model-config-subpage slot="view" id="add-model"
    data-parent-view-id="model-list" prefs="{{prefs}}">
  </model-config-subpage>
</cr-view-manager>
